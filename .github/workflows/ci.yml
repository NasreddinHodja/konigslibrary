name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # The archive parser is a Rust crate compiled to wasm, so the frontend
      # cannot be type-checked or built without a Rust toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          # For cargo-llvm-cov, which reads the coverage with them.
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # Must match the wasm-bindgen version pinned in crates/klwasm/Cargo.toml;
      # the two refuse to work together across versions. Cached by rust-cache.
      - run: cargo install -f wasm-bindgen-cli --version 0.2.99

      - run: bun install --frozen-lockfile

      - run: bun run build:wasm

      - run: bun run lint

      - run: bun run check

      # The tests, with coverage. Vitest empties coverage/ first, so it goes
      # before the Rust report written there.
      - run: bunx vitest run --coverage

      - run: cargo llvm-cov --manifest-path crates/Cargo.toml --workspace --lcov --output-path coverage/rust.lcov

      - name: Coverage summary
        run: |
          {
            echo '## Coverage'
            echo '### Frontend'
            bun -e 'const t = (await Bun.file("coverage/coverage-summary.json").json()).total;
              console.log(`Lines ${t.lines.pct}% · Branches ${t.branches.pct}% · Functions ${t.functions.pct}%`)'
            echo '### Rust'
            echo '```'
            cargo llvm-cov report --manifest-path crates/Cargo.toml --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The HTML report (coverage/index.html) and both lcov files.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

      - run: bun run build

  # The self-hosted app in a browser (playwright.config.ts): reading flows and
  # axe's accessibility checks, against the simulated library.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # Same as the ci job.
      - run: cargo install -f wasm-bindgen-cli --version 0.2.99

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      # Compiled ahead, so the server starts within Playwright's wait for it.
      - run: cargo build --manifest-path crates/Cargo.toml -p klserver

      - run: bun run test:e2e

      # Traces of the failed tests, viewable with `bunx playwright show-report`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # The desktop and Android app's own Rust, which builds on crates/: nothing
  # else compiles it before a release.
  tauri:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Same as release-linux.yml.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file \
            libssl-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A bundled resource the build checks for; build:sidecar fills it for a
      # release, and the tests don't read it.
      - run: mkdir -p src-tauri/binaries/konigslibrary-server-assets

      - run: cargo test --manifest-path src-tauri/Cargo.toml
