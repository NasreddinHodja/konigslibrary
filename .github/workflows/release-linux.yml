name: Release Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.8.0'
        required: true

permissions:
  contents: write
  # actions/attest: OIDC token for the Sigstore certificate, storing the
  # attestation, and the artifact storage record.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # git-cliff needs the tags and history for the release notes.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file \
            libssl-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: oven-sh/setup-bun@v2

      # The archive parser is a Rust crate compiled to wasm, so the frontend
      # cannot be built without a Rust toolchain, same as ci.yml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # Must match the wasm-bindgen version pinned in crates/klwasm/Cargo.toml;
      # the two refuse to work together across versions. Cached by rust-cache.
      - run: cargo install -f wasm-bindgen-cli --version 0.2.99

      - run: bun install --frozen-lockfile

      - run: bun run build:desktop:host

      # See scripts/build-appimage.js.
      - name: Repack AppImage without host libraries
        id: appimage
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          wget -qO appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          appdir=$(ls -d src-tauri/target/release/bundle/appimage/*.AppDir | head -1)
          name=$(basename "$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)")
          rm -f "$appdir"/usr/lib/libwayland-*
          mkdir -p dist
          ./appimagetool --comp xz "$appdir" "dist/$name"
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"

      # The headless server for a VPS or NAS: the same binary and client
      # build:sidecar made for the AppImage, which static_dir() finds next to
      # it. Built on Ubuntu 24.04, so it needs that glibc or newer.
      - name: Package headless server
        id: server
        run: |
          version=$(bun -p "require('./package.json').version")
          dir="konigslibrary-server_${version}_linux_x86_64"
          mkdir -p "$dir"
          cp -r src-tauri/binaries/konigslibrary-server-assets/. "$dir/"
          tar -czf "dist/$dir.tar.gz" "$dir"
          echo "path=dist/$dir.tar.gz" >> "$GITHUB_OUTPUT"

      # Signed build provenance, checked with `gh attestation verify`.
      - uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.appimage.outputs.path }}
            ${{ steps.server.outputs.path }}

      # Only this workflow writes the release notes (see cliff.toml); the
      # Windows and Android ones leave the body alone.
      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ steps.appimage.outputs.path }}
            ${{ steps.server.outputs.path }}
          body: ${{ steps.notes.outputs.content }}
