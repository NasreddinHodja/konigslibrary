name: Release Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK and build-tools
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" "build-tools;36.1.0" "platforms;android-36"

      - name: Set up Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # Must match the wasm-bindgen version pinned in crates/klwasm/Cargo.toml;
      # the two refuse to work together across versions. Cached by rust-cache.
      # `bun tauri android build` triggers `TAURI_BUILD=1 bun run build`
      # (tauri.conf.json's beforeBuildCommand), which needs this to build the wasm parser.
      - run: cargo install -f wasm-bindgen-cli --version 0.2.99

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Android APK
        run: bun tauri android build --target aarch64
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT || '/usr/local/lib/android/sdk' }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT || '/usr/local/lib/android/sdk' }}/ndk/28.2.13676358

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Sign APK
        run: |
          "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/36.1.0/apksigner" sign \
            --ks /tmp/release.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "konigslibrary.apk" \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: konigslibrary.apk
          generate_release_notes: true
