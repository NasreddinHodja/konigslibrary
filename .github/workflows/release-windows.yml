name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # actions/attest: OIDC token for the Sigstore certificate, storing the
  # attestation, and the artifact storage record.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # The archive parser is a Rust crate compiled to wasm, so the frontend
      # cannot be built without a Rust toolchain, same as ci.yml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # Must match the wasm-bindgen version pinned in crates/klwasm/Cargo.toml;
      # the two refuse to work together across versions. Cached by rust-cache.
      - run: cargo install -f wasm-bindgen-cli --version 0.2.99

      - run: bun install --frozen-lockfile

      # Builds the konigslibrary-server.exe sidecar + its embedded static
      # assets, packaged as a bundle.resources entry (see build-sidecar.js).
      - run: bun run build:sidecar

      - run: bun run clean:kit

      - run: bun run prepare

      - run: bun tauri build

      - name: Locate NSIS installer
        id: installer
        shell: bash
        run: |
          installer=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          mkdir -p dist
          cp "$installer" dist/
          echo "path=dist/$(basename "$installer")" >> "$GITHUB_OUTPUT"

      # Signed build provenance, checked with `gh attestation verify`.
      - uses: actions/attest@v4
        with:
          subject-path: '${{ steps.installer.outputs.path }}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.installer.outputs.path }}
