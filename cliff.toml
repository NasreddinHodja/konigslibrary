# Release notes for the GitHub release, generated by release-linux.yml with
# `git-cliff --latest --strip header`. Only feat, fix and perf commits are
# listed; the rest are left out.
#
# A squash merge's subject is the PR title and its body lists the PR's
# commits as `* feat: …` lines, so each line is read as a commit of its own.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = true
# Run before the split, on the whole message.
commit_preprocessors = [{ pattern = '(?m)^\* ', replace = "" }]
# Group names sort alphabetically, which is the order they're listed in.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
