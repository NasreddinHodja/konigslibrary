<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f2fa" />
    <meta name="description" content="Client-side manga reader" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      @font-face {
        font-family: 'VGA';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/WebPlus_IBM_VGA_9x16.woff') format('woff');
      }
    </style>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('kl:theme') || 'null');
        if (t) {
          var r = document.documentElement;
          if (t.bg) r.style.setProperty('--color-bg', t.bg);
          if (t.fg) r.style.setProperty('--color-fg', t.fg);
          if (t.ink || t.border) r.style.setProperty('--color-ink', t.ink || t.border);
        }
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
