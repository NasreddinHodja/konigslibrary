[package]
name = "klserver"
description = "Local HTTP server for konigslibrary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "konigslibrary-server"
path = "src/main.rs"

[dependencies]
klfs = { workspace = true }
klparse = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
rusqlite = { version = "0.37", features = ["bundled", "collation"] }

[dev-dependencies]
klparse = { workspace = true, features = ["fixtures"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Without the plotting and parallel analysis it pulls in by default.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "index"
harness = false
