[workspace]
resolver = "2"
members = ["klparse", "klserver", "klwasm"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NasreddinHodja/konigslibrary"

[workspace.dependencies]
klparse = { path = "klparse" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
