[package]
name = "klwasm"
description = "Browser bindings for konigslibrary's archive parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
klparse = { workspace = true }
# Pinned exactly: wasm-bindgen refuses to run when the crate and the CLI that
# post-processes its output disagree on version.
wasm-bindgen = "=0.2.99"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
serde = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
